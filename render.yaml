# Render blueprint — one web service (API + both SPAs) and one Postgres instance.
# Create from the Render dashboard: New → Blueprint → point at this repo.
services:
  - type: web
    # The name still says cornerpost, and so does the free address Render gives it
    # (cornerpost….onrender.com). Renaming it HERE would make Render create a second, empty
    # service next to this one (and drop the custom domain from it), so the name is changed in
    # the dashboard instead (Service → Settings → Name), after the QR codes point at the
    # custom domain. Until then the app redirects that address to PUBLIC_ORIGIN.
    name: cornerpost
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    # Off on purpose. Render's own auto-deploy fires on push, before CI has
    # said anything — which is how a crash-looping schema reached production.
    # ci.yml fires the deploy hook instead, once tests are green on main. Left
    # on, the two race and the unverified one usually wins.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cornerpost-db
          property: connectionString
      # Signs admin and buyer session tokens. Render generates it once.
      - key: SESSION_SECRET
        generateValue: true
      # Shared secret for the Zapier rate webhook.
      - key: RATES_WEBHOOK_SECRET
        generateValue: true
      # The first admin account. Set both in the Render dashboard before the
      # first deploy, then change the password from a value you control.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # The one public address of the site, with the https://. Canonical links, share
      # previews, the QR and Copy link in the admin and the links in emails use it, and the
      # Render address redirects to it. Unset, they follow whichever address a visitor came
      # in on, and a site that answers on two names publishes both.
      - key: PUBLIC_ORIGIN
        value: https://touradoor.com
      # "on" sends a visit to the Render address on to PUBLIC_ORIGIN (the admin pages and the API
      # are never sent). If the domain ever has to be taken offline, change this to "off" (here AND in
      # the dashboard's Environment tab, or a later blueprint sync puts it back): the service restarts
      # and the Render address works again in a minute or two.
      - key: REDIRECT_TO_PUBLIC_ORIGIN
        value: "on"
      # Email. Without RESEND_API_KEY nothing is sent (requests are still saved).
      # EMAIL_FROM must be an address on a domain verified in Resend, and one that
      # is read: the sandbox sender only delivers to the Resend account owner.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # A fresh deployment starts empty rather than with a demo community.
      - key: SEED_DEMO
        value: "false"
      # CI tests Node 20 and 22; pin what Render builds with to one of them.
      - key: NODE_VERSION
        value: "22"

databases:
  - name: cornerpost-db
    plan: basic-256mb
    region: oregon
    databaseName: cornerpost
    user: cornerpost
