# Render blueprint — one web service (API + both SPAs) and one Postgres instance.
# Create from the Render dashboard: New → Blueprint → point at this repo.
services:
  - type: web
    name: project-sellers-app
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: project-sellers-db
          property: connectionString
      # Signs admin and buyer session tokens. Render generates it once.
      - key: SESSION_SECRET
        generateValue: true
      # Shared secret for the Zapier rate webhook.
      - key: RATES_WEBHOOK_SECRET
        generateValue: true
      # The first admin account. Set both in the Render dashboard before the
      # first deploy, then change the password from a value you control.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: project-sellers-db
    plan: basic-256mb
    region: oregon
    databaseName: project_sellers
    user: project_sellers
