name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests and production build
    runs-on: ubuntu-latest

    # The schema tests need a real Postgres. Render runs Postgres, and a migration
    # bug that only appears on an existing database is invisible to the JSON store.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 22 is what Render runs.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      # Mirrors Render exactly: NODE_ENV=production makes npm omit devDependencies,
      # which silently broke the client build until --include=dev was added.
      - name: Build the client the way Render does
        run: npm run build
        env:
          NODE_ENV: production

      - name: Boot the server and check it serves the app
        run: |
          node server/index.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 1
          done

          curl -sf http://127.0.0.1:3000/api/health | tee /dev/stderr | grep -q '"ok":true'
          curl -sf http://127.0.0.1:3000/admin | grep -q '<div id="root">'
        env:
          NODE_ENV: production
          PORT: '3000'
          SEED_DEMO: 'false'
          SESSION_SECRET: ci-smoke-test-secret
          DATA_FILE: ${{ runner.temp }}/ci-db.json

  # Render's own auto-deploy fires on push, before CI has said anything — which is
  # how a crash-looping schema reached production once. This deploys only what has
  # already gone green, and only from main.
  #
  # It is a separate job on purpose: `test` is a two-entry matrix, so a step inside
  # it would fire two deploys for every merge.
  deploy:
    name: Deploy to Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set — skipping the deploy."
            echo "Add it under Settings → Secrets and variables → Actions to turn this on."
            exit 0
          fi
          # --fail makes a non-2xx a build failure rather than a silent no-op, so a
          # revoked or mistyped hook is visible instead of looking like a deploy.
          code=$(curl -sS --fail-with-body -o /tmp/hook-response -w '%{http_code}' -X POST "$HOOK")
          echo "Render responded $code"
          cat /tmp/hook-response
